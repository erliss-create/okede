<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiwa Lab Pro & Kanji Furigana</title>
    <!-- Menggunakan Tailwind CSS untuk keindahan desain interaktif -->
    <script src="https://tailwindcss.com"></script>
    <style>
        ruby { ruby-position: over; }
        rt { font-size: 0.58em; color: #4f46e5; font-weight: bold; padding-bottom: 0.1em; letter-spacing: 0.05em; }
        .kanji-clickable { border-bottom: 2px dashed #6366f1; cursor: pointer; transition: all 0.2s; }
        .kanji-clickable:hover { background-color: #e0e7ff; color: #312e81; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-800">

    <!-- Header Menu Utama -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50 p-4">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🇯🇵 Kaiwa Studio & Lab Kanji Pro
            </h1>
            
            <!-- Saklar Pilihan Mode -->
            <div class="flex bg-indigo-900/60 p-1 rounded-xl shadow-inner border border-indigo-500/20">
                <button id="btnViewMode" onclick="switchMode('view')" class="px-5 py-1.5 rounded-lg text-sm font-semibold transition bg-white text-indigo-700 shadow-sm">
                    📖 Mode Belajar
                </button>
                <button id="btnEditMode" onclick="switchMode('edit')" class="px-5 py-1.5 rounded-lg text-sm font-semibold transition text-indigo-100 hover:text-white">
                    📝 Mode Edit
                </button>
            </div>

            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-md text-xs font-semibold shadow-2xs transition">
                    📥 Ekspor Data
                </button>
                <label class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-md text-xs font-semibold shadow-2xs transition cursor-pointer">
                    📤 Impor Data
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- SIDEBAR: Pengelola Judul Latihan -->
        <aside class="lg:col-span-1 bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 h-fit">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-700 text-base">Daftar Kaiwa Anda</h2>
                <button onclick="createNewKaiwa()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-2.5 rounded-md transition shadow-2xs">
                    + Baru
                </button>
            </div>
            <ul id="kaiwaList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Data judul dimuat dari JS -->
            </ul>
        </aside>

        <!-- MAIN AREA WORKSPACE -->
        <main class="lg:col-span-3 space-y-6">
            
            <!-- Seksi Info Utama Dokumen -->
            <section class="bg-white p-5 rounded-xl shadow-xs border border-slate-200/80">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Judul / Topik Pembelajaran</label>
                        <input type="text" id="kaiwaTitle" placeholder="Contoh: Perkenalan Pertama di Kantor" 
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-bold focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:outline-hidden text-lg hidden">
                        <h2 id="kaiwaTitleDisplay" class="text-2xl font-black text-slate-800 tracking-tight"></h2>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Level / Tag Penanda</label>
                        <input type="text" id="kaiwaLevel" placeholder="Contoh: N4 - Bab 2" 
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-700 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:outline-hidden hidden">
                        <div>
                            <span id="kaiwaLevelDisplay" class="inline-block text-xs bg-indigo-50 border border-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold mt-1 shadow-3xs"></span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ================= MODE EDIT WORKSPACE ================= -->
            <section id="sectionEdit" class="bg-white p-6 rounded-xl shadow-xs border border-slate-200/80 space-y-6 hidden">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <span>📝</span> Penyusunan Baris Percakapan & Kumpulan Kata
                    </h3>
                    <button onclick="addDialogueLine()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-2 px-3 rounded-lg transition shadow-3xs">
                        + Tambah Baris Dialog
                    </button>
                </div>

                <!-- Wadah utama form input percakapan -->
                <div id="dialogueContainer" class="space-y-6"></div>

                <!-- Bagian Penjelasan Bunpou Mandiri -->
                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <span>📚</span> Papan Catatan Bunpou (Tata Bahasa & Catatan Partikel)
                    </label>
                    <textarea id="bunpouNotes" rows="5" placeholder="Tulis penjelasan tata bahasa atau pola kalimat penting yang dipelajari di percakapan ini..." 
                        class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:outline-hidden font-mono text-sm text-slate-700 leading-relaxed"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                    <button onclick="resetEditor()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">
                        Batal
                    </button>
                    <button onclick="saveCurrentKaiwa()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-xs transition">
                        Simpan & Tampilkan
                    </button>
                </div>
            </section>

            <!-- ================= MODE BELAJAR INTERAKTIF ================= -->
            <section id="sectionView" class="bg-white p-6 rounded-xl shadow-xs border border-slate-200/80 space-y-6">
                <div class="border-b border-slate-100 pb-3 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <span>📖</span> Lembar Baca Percakapan & Analisis Kanji
                    </h3>
                    <p class="text-[11px] text-slate-400 font-medium">💡 Sentuh/Klik kata bertanda bawah untuk memunculkan detail radikal.</p>
                </div>

                <!-- Wadah utama render balon teks jepang -->
                <div id="dialogueViewContainer" class="space-y-4"></div>

                <!-- Kotak Informasi Detail Radikal Kanji (Muncul Hanya Jika Diklik) -->
                <div id="kanjiDetailPanel" class="hidden bg-amber-50/70 border border-amber-200/80 rounded-xl p-4 space-y-2 animate-fadeIn shadow-3xs">
                    <div class="flex justify-between items-center border-b border-amber-200 pb-1.5">
                        <h4 class="text-xs font-bold text-amber-800 uppercase tracking-wider flex items-center gap-1">
                            <span>🔍</span> Informasi Analisis Komponen Radikal Kanji
                        </h4>
                        <button onclick="document.getElementById('kanjiDetailPanel').classList.add('hidden')" class="text-amber-500 hover:text-amber-700 font-bold text-xs">✕ Tutup</button>
                    </div>
                    <p id="kanjiDetailTarget" class="text-lg font-bold text-indigo-950"></p>
                    <p id="kanjiDetailText" class="text-sm font-medium text-amber-950 leading-relaxed"></p>
                </div>

                <!-- Tampilan Catatan Bunpou / Tata Bahasa -->
                <div id="bunpouViewContainer" class="bg-indigo-50/40 border border-indigo-100 rounded-xl p-5 space-y-3">
                    <h4 class="text-sm font-bold text-indigo-900 flex items-center gap-2 border-b border-indigo-100/60 pb-2">
                        <span>📚</span> Catatan Dokumen Tata Bahasa (Bunpou)
                    </h4>
                    <p id="bunpouViewText" class="text-slate-700 text-sm leading-relaxed whitespace-pre-wrap font-sans italic"></p>
                </div>
            </section>

        </main>
    </div>

    <!-- SCRIPT LOGIKA UTAMA APLIKASI -->
    <script>
        let allKaiwa = [];
        let currentEditingId = null;
        let activeMode = 'view';

        window.onload = function() {
            try {
                const savedData = localStorage.getItem('github_kaiwa_pro_data');
